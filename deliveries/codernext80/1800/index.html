<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Görev Masası</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; }
        .container { max-width: 640px; margin: 0 auto; padding: 20px; }
        header { background: white; padding: 16px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 20px; color: #333; }
        .user-info { font-size: 14px; color: #666; }
        .logout-btn { background: #dc3545; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        .logout-btn:hover { background: #c82333; }
        .stats { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat-card { background: white; padding: 12px 16px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); flex: 1; min-width: 80px; text-align: center; }
        .stat-card h3 { font-size: 14px; color: #666; margin-bottom: 4px; }
        .stat-card .count { font-size: 24px; font-weight: bold; color: #333; }
        .filters { background: white; padding: 16px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .filter-row { display: flex; gap: 12px; flex-wrap: wrap; }
        .filter-group { flex: 1; min-width: 120px; }
        .filter-group label { display: block; margin-bottom: 6px; font-weight: 500; color: #555; }
        .filter-group input, .filter-group select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        .filter-btn { padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .filter-btn:hover { background: #0056b3; }
        .task-form { background: white; padding: 16px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 6px; font-weight: 500; color: #555; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        .form-group textarea { min-height: 80px; }
        .form-actions { display: flex; gap: 12px; }
        .btn { padding: 10px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .btn-primary { background: #007bff; color: white; }
        .btn-primary:hover { background: #0056b3; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-secondary:hover { background: #5a6268; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-danger:hover { background: #c82333; }
        .task-list { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .task-item { padding: 16px; border-bottom: 1px solid #eee; }
        .task-item:last-child { border-bottom: none; }
        .task-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .task-title { font-weight: 600; color: #333; }
        .task-meta { font-size: 12px; color: #888; }
        .task-actions { display: flex; gap: 8px; }
        .empty-state { padding: 40px 20px; text-align: center; color: #888; }
        .error { color: #dc3545; margin-top: 12px; }
        .success { color: #28a745; margin-top: 12px; }
        .status-todo { color: #17a2b8; }
        .status-doing { color: #ffc107; }
        .status-done { color: #28a745; }
        .priority-low { color: #6c757d; }
        .priority-normal { color: #007bff; }
        .priority-high { color: #dc3545; }
        @media (max-width: 390px) {
            .filter-row { flex-direction: column; }
            .filter-group { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Görev Masası</h1>
            <div>
                <span class="user-info" id="userInfo"></span>
                <button class="logout-btn" id="logoutBtn">Çıkış yap</button>
            </div>
        </header>
        
        <div class="stats" id="statsContainer">
            <div class="stat-card">
                <h3>Toplam</h3>
                <div class="count" id="totalCount">0</div>
            </div>
            <div class="stat-card">
                <h3>Yapılacak</h3>
                <div class="count" id="todoCount">0</div>
            </div>
            <div class="stat-card">
                <h3>Sürüyor</h3>
                <div class="count" id="doingCount">0</div>
            </div>
            <div class="stat-card">
                <h3>Tamamlandı</h3>
                <div class="count" id="doneCount">0</div>
            </div>
        </div>
        
        <div class="filters">
            <div class="filter-row">
                <div class="filter-group">
                    <label for="searchInput">Ara</label>
                    <input type="text" id="searchInput" placeholder="Başlık veya açıklama">
                </div>
                <div class="filter-group">
                    <label for="statusFilter">Durum filtresi</label>
                    <select id="statusFilter">
                        <option value="">Tümü</option>
                        <option value="todo">Yapılacak</option>
                        <option value="doing">Sürüyor</option>
                        <option value="done">Tamamlandı</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="priorityFilter">Öncelik filtresi</label>
                    <select id="priorityFilter">
                        <option value="">Tümü</option>
                        <option value="low">Düşük</option>
                        <option value="normal" selected>Normal</option>
                        <option value="high">Yüksek</option>
                    </select>
                </div>
                <button class="filter-btn" id="filterBtn">Filtrele</button>
            </div>
        </div>
        
        <div class="task-form" id="taskFormContainer">
            <h2 id="formTitle">Yeni Görev</h2>
            <form id="taskForm">
                <input type="hidden" id="taskId">
                <div class="form-group">
                    <label for="title">Başlık</label>
                    <input type="text" id="title" required maxlength="120">
                </div>
                <div class="form-group">
                    <label for="description">Açıklama</label>
                    <textarea id="description" maxlength="1000"></textarea>
                </div>
                <div class="form-group">
                    <label for="status">Durum</label>
                    <select id="status">
                        <option value="todo">Yapılacak</option>
                        <option value="doing">Sürüyor</option>
                        <option value="done">Tamamlandı</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="priority">Öncelik</label>
                    <select id="priority">
                        <option value="low">Düşük</option>
                        <option value="normal" selected>Normal</option>
                        <option value="high">Yüksek</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="saveBtn">Kaydet</button>
                    <button type="button" class="btn btn-secondary" id="cancelBtn" style="display: none;">Vazgeç</button>
                </div>
                <div id="formError" class="error"></div>
                <div id="formSuccess" class="success"></div>
            </form>
        </div>
        
        <div class="task-list" id="taskList">
            <div class="empty-state">Henüz görev yok. Yeni bir görev ekleyin!</div>
        </div>
    </div>
    
    <script>
        let currentTasks = [];
        let editingTaskId = null;
        
        document.addEventListener('DOMContentLoaded', async () => {
            await loadUser();
            await loadTasks();
            setupEventListeners();
        });
        
        async function loadUser() {
            try {
                const res = await fetch('/api/me');
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('userInfo').textContent = 'Hoşgeldin, ' + data.username;
                } else {
                    window.location.href = '/';
                }
            } catch (err) {
                window.location.href = '/';
            }
        }
        
        async function loadTasks() {
            try {
                const res = await fetch('/api/tasks');
                if (res.ok) {
                    const data = await res.json();
                    currentTasks = data.items;
                    renderTasks(currentTasks);
                    renderStats(data.total);
                }
            } catch (err) {
                console.error('Görevler yüklenemedi:', err);
            }
        }
        
        async function loadStats() {
            try {
                const res = await fetch('/api/stats');
                if (res.ok) {
                    const data = await res.json();
                    renderStats(data.total);
                }
            } catch (err) {
                console.error('İstatistikler yüklenemedi:', err);
            }
        }
        
        function renderStats(total) {
            const todo = currentTasks.filter(t => t.status === 'todo').length;
            const doing = currentTasks.filter(t => t.status === 'doing').length;
            const done = currentTasks.filter(t => t.status === 'done').length;
            
            document.getElementById('totalCount').textContent = total;
            document.getElementById('todoCount').textContent = todo;
            document.getElementById('doingCount').textContent = doing;
            document.getElementById('doneCount').textContent = done;
        }
        
        function renderTasks(tasks) {
            const container = document.getElementById('taskList');
            if (tasks.length === 0) {
                container.innerHTML = '<div class="empty-state">Henüz görev yok. Yeni bir görev ekleyin!</div>';
                return;
            }
            
            container.innerHTML = tasks.map(task => `
                <div class="task-item" data-id="${task.id}">
                    <div class="task-header">
                        <div>
                            <div class="task-title">${escapeHtml(task.title)}</div>
                            <div class="task-meta">
                                <span class="status-${task.status}">${getStatusText(task.status)}</span> | 
                                <span class="priority-${task.priority}">${getPriorityText(task.priority)}</span>
                            </div>
                            ${task.description ? `<div style="margin-top: 4px; color: #666;">${escapeHtml(task.description)}</div>` : ''}
                        </div>
                    </div>
                    <div class="task-actions">
                        <button class="btn btn-secondary" onclick="editTask(${task.id})">Düzenle</button>
                        <button class="btn btn-danger" onclick="deleteTask(${task.id})">Sil</button>
                    </div>
                </div>
            `).join('');
        }
        
        function getStatusText(status) {
            const texts = { 'todo': 'Yapılacak', 'doing': 'Sürüyor', 'done': 'Tamamlandı' };
            return texts[status] || status;
        }
        
        function getPriorityText(priority) {
            const texts = { 'low': 'Düşük', 'normal': 'Normal', 'high': 'Yüksek' };
            return texts[priority] || priority;
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
        
        function setupEventListeners() {
            document.getElementById('logoutBtn').addEventListener('click', async () => {
                await fetch('/api/logout', { method: 'POST' });
                window.location.href = '/';
            });
            
            document.getElementById('filterBtn').addEventListener('click', async () => {
                const search = document.getElementById('searchInput').value;
                const status = document.getElementById('statusFilter').value;
                const priority = document.getElementById('priorityFilter').value;
                
                let url = '/api/tasks?';
                if (search) url += `q=${encodeURIComponent(search)}&`;
                if (status) url += `status=${encodeURIComponent(status)}&`;
                if (priority) url += `priority=${encodeURIComponent(priority)}&`;
                
                try {
                    const res = await fetch(url);
                    if (res.ok) {
                        const data = await res.json();
                        currentTasks = data.items;
                        renderTasks(currentTasks);
                        renderStats(data.total);
                    }
                } catch (err) {
                    console.error('Filtreleme başarısız:', err);
                }
            });
            
            document.getElementById('taskForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const title = document.getElementById('title').value.trim();
                const description = document.getElementById('description').value.trim();
                const status = document.getElementById('status').value;
                const priority = document.getElementById('priority').value;
                
                const errorEl = document.getElementById('formError');
                const successEl = document.getElementById('formSuccess');
                errorEl.textContent = '';
                successEl.textContent = '';
                
                if (!title) {
                    errorEl.textContent = 'Başlık zorunludur';
                    return;
                }
                
                const data = { title, description, status, priority };
                const method = editingTaskId ? 'PUT' : 'POST';
                const url = editingTaskId ? `/api/tasks/${editingTaskId}` : '/api/tasks';
                
                try {
                    const res = await fetch(url, {
                        method,
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    
                    if (res.ok) {
                        const result = await res.json();
                        if (editingTaskId) {
                            const index = currentTasks.findIndex(t => t.id === editingTaskId);
                            if (index !== -1) {
                                currentTasks[index] = result;
                            }
                        } else {
                            currentTasks.unshift(result);
                        }
                        renderTasks(currentTasks);
                        renderStats(currentTasks.length);
                        successEl.textContent = 'Görev kaydedildi!';
                        setTimeout(() => {
                            document.getElementById('taskForm').reset();
                            document.getElementById('taskId').value = '';
                            editingTaskId = null;
                            document.getElementById('formTitle').textContent = 'Yeni Görev';
                            document.getElementById('saveBtn').textContent = 'Kaydet';
                            document.getElementById('cancelBtn').style.display = 'none';
                            successEl.textContent = '';
                        }, 1000);
                    } else {
                        const error = await res.json();
                        errorEl.textContent = error.error || 'Kayıt başarısız';
                    }
                } catch (err) {
                    errorEl.textContent = 'Bağlantı hatası';
                }
            });
            
            document.getElementById('cancelBtn').addEventListener('click', () => {
                document.getElementById('taskForm').reset();
                document.getElementById('taskId').value = '';
                editingTaskId = null;
                document.getElementById('formTitle').textContent = 'Yeni Görev';
                document.getElementById('saveBtn').textContent = 'Kaydet';
                document.getElementById('cancelBtn').style.display = 'none';
            });
        }
        
        window.editTask = async (id) => {
            const task = currentTasks.find(t => t.id === id);
            if (!task) return;
            
            editingTaskId = id;
            document.getElementById('taskId').value = id;
            document.getElementById('title').value = task.title;
            document.getElementById('description').value = task.description;
            document.getElementById('status').value = task.status;
            document.getElementById('priority').value = task.priority;
            
            document.getElementById('formTitle').textContent = 'Görev Düzenle';
            document.getElementById('saveBtn').textContent = 'Güncelle';
            document.getElementById('cancelBtn').style.display = 'inline-block';
        };
        
        window.deleteTask = async (id) => {
            if (!confirm('Bu görevi silmek istediğinize emin misiniz?')) return;
            
            try {
                const res = await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    currentTasks = currentTasks.filter(t => t.id !== id);
                    renderTasks(currentTasks);
                    renderStats(currentTasks.length);
                }
            } catch (err) {
                console.error('Silme başarısız:', err);
            }
        };
    </script>
</body>
</html>
